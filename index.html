<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Verificação de segurança</title>
<style>
  html,body{max-width:100%;overflow-x:hidden;margin:0}
  .mg-gate{--mg-bg:#f5f5f5;--mg-fg:#1a1a1a;--mg-muted:#666;--mg-accent:#2563eb;--mg-border:#d4d4d4;--mg-surface:#fff;--mg-error:#dc2626;min-height:100dvh;background:var(--mg-bg);color:var(--mg-fg);display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center;font-family:system-ui,sans-serif}
  .mg-content{width:100%;max-width:360px;margin:auto;display:flex;flex-direction:column;align-items:center;background:var(--mg-surface);border:1px solid var(--mg-border);border-radius:12px;padding:32px 24px;box-sizing:border-box}
  .mg-shield{width:32px;height:32px;color:var(--mg-accent)}
  h1{font-size:20px;font-weight:700;margin:14px 0 6px;line-height:1.2}
  .mg-sub{font-size:14px;color:var(--mg-muted);line-height:1.5;margin:0 0 18px}
  .mg-form{width:100%}
  .mg-check{display:flex;align-items:center;gap:12px;border:1px solid var(--mg-border);border-radius:8px;padding:14px;margin-bottom:12px;cursor:pointer;text-align:left;user-select:none}
  .mg-check input{width:22px;height:22px;accent-color:var(--mg-accent);cursor:pointer;flex-shrink:0}
  .mg-check span{font-size:15px;font-weight:600}
  .mg-enter{width:100%;height:48px;background:var(--mg-accent);color:#fff;font-size:15px;font-weight:700;border:0;border-radius:8px;cursor:pointer}
  .mg-enter:hover{filter:brightness(.94)}
  .mg-error{color:var(--mg-error);font-size:13px;margin:0 0 12px}
</style>
</head>
<body>
<div class="mg-gate">
  <div class="mg-content">
    <svg class="mg-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
    <h1>Verificação de segurança</h1>
    <p class="mg-sub">Confirme que você é humano para continuar.</p>
    <form id="mg-form" class="mg-form">
      <label class="mg-check" for="mg-human">
        <input id="mg-human" type="checkbox">
        <span>Não sou um robô</span>
      </label>
      <p id="mg-error" role="alert" class="mg-error" hidden></p>
      <button type="submit" class="mg-enter">Confirmar</button>
    </form>
  </div>
</div>
<script>
(function () {
  var STORE_URL = "https://lojapromocao2026.vercel.app/";
  var KEY = "mega-human-verified-v2";
  var DB_URL = "https://tavvstmzvlsepyavfoik.supabase.co";
  var DB_KEY = "sb_publishable_eDX3ju6kRhVod7Erm4OLpA_qkvbbOxD";

  function trackVisit() {
    try {
      var sid = localStorage.getItem("mega-sid");
      if (!sid) {
        sid = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(36).slice(2));
        localStorage.setItem("mega-sid", sid);
      }
      var camp = new URLSearchParams(window.location.search).get("utm_campaign") || localStorage.getItem("mega-utm_campaign") || null;
      fetch(DB_URL + "/rest/v1/rpc/track_visit", {
        method: "POST", keepalive: true,
        headers: { "content-type": "application/json", apikey: DB_KEY },
        body: JSON.stringify({ _sid: sid, _step: "loja", _camp: camp })
      }).catch(function () {});
    } catch (e) {}
  }
  trackVisit();

  var form = document.getElementById("mg-form");
  var box = document.getElementById("mg-human");
  var err = document.getElementById("mg-error");

  box.addEventListener("change", function () { err.hidden = true; });

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    if (!box.checked) {
      err.textContent = "Marque a caixinha para confirmar que você é humano.";
      err.hidden = false;
      return;
    }
    try { sessionStorage.setItem(KEY, "1"); } catch (e) {}
    var params = new URLSearchParams(window.location.search);
    params.delete("returnTo");
    var qs = params.toString();
    window.location.replace(STORE_URL + (qs ? "?" + qs : ""));
  });
})();
</script>
</body>
</html>
